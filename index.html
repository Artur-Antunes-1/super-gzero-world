<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gravidade Zero — O Jogo</title>
    <meta name="description" content="Plataforma 2D pixel-art da Gravidade Zero: corra, salte e ative o Humanware para reparar o mundo." />
    <meta name="theme-color" content="#ff0055" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #060608;
      }
      body {
        /* moldura: vinheta escura do centro pras bordas */
        background: radial-gradient(ellipse at center, #101016 0%, #060608 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      #game {
        image-rendering: crisp-edges; /* fallback p/ browsers sem pixelated */
        image-rendering: pixelated;
        background: #09090b;
        box-shadow: 0 0 60px rgba(255, 0, 85, 0.08);
        border-radius: 0;
      }
      .rodape {
        margin-top: 10px;
        font: 10px/1 monospace;
        letter-spacing: 2px;
        color: #3a3a42;
        user-select: none;
      }
    </style>
  </head>
  <body>
    <canvas id="game" width="960" height="528"></canvas>
    <div class="rodape">GRAVIDADE ZERO — O JOGO</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
