<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gravidade Zero — O Jogo</title>
    <meta name="description" content="Plataforma 2D pixel-art da Gravidade Zero: corra, salte e ative o Humanware para reparar o mundo." />
    <meta name="theme-color" content="#ff0055" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      @font-face {
        font-family: 'Press Start 2P';
        src: url('/assets/fonts/PressStart2P.ttf') format('truetype');
        font-display: block;
      }
      @font-face {
        font-family: 'Pixelify Sans';
        src: url('/assets/fonts/PixelifySans.ttf') format('truetype');
        font-weight: 400 700;
        font-display: block;
      }
      html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #060608;
      }
      body {
        /* moldura: vinheta escura do centro pras bordas */
        background: radial-gradient(ellipse at center, #101016 0%, #060608 100%);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #game {
        image-rendering: crisp-edges; /* fallback p/ browsers sem pixelated */
        image-rendering: pixelated;
        background: #09090b;
        box-shadow: 0 0 80px rgba(255, 0, 85, 0.10);
        border-radius: 0;
        display: block;
      }
      .rodape {
        /* fora do fluxo: nao rouba altura do canvas (que agora preenche a janela) */
        position: fixed;
        bottom: 6px;
        left: 0;
        right: 0;
        text-align: center;
        font: 10px/1 monospace;
        letter-spacing: 2px;
        color: #2a2a31;
        user-select: none;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <canvas id="game" width="960" height="528"></canvas>
    <div class="rodape">GRAVIDADE ZERO — O JOGO</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
